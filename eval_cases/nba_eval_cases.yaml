metadata:
  dataset_name: nba_rag_eval_baseline
  version: 6
  experiment_name: pydantic_evals_refactor
  language: fr
  source_language: en
  purpose: >
    Cas d'évaluation manuels pour le prototype RAG existant. Les cas sont
    ancrés dans les PDF Reddit et le fichier Excel NBA actuellement indexés.
    Ils sont prévus pour être réutilisés avant et après l'enrichissement par
    outil SQL.
  source_scope:
    - inputs/Reddit 1.pdf
    - inputs/Reddit 2.pdf
    - inputs/Reddit 3.pdf
    - inputs/Reddit 4.pdf
    - inputs/regular NBA.xlsx
  notes:
    - Le prototype actuel indexe le classeur Excel sous forme de texte dans FAISS.
    - Les cas quantitatifs exposent volontairement les limites d'un RAG textuel sur des données structurées.

cases:
  - id: Q01
    category: qualitative_simple
    source_type: reddit
    language: fr
    question: Pourquoi le Magic d'Orlando est-il présenté comme une équipe prometteuse dans la discussion playoff ?
    reference_answer: >
      La discussion présente Orlando comme une jeune équipe prometteuse parce
      que Paolo Banchero et Franz Wagner sont décrits comme un duo d'ailiers
      solide, capable de scorer, de défendre et de poser des problèmes au
      champion en titre malgré un spacing faible et des absences importantes. La
      principale limite mentionnée est qu'Orlando a encore besoin de meilleurs
      shooteurs et d'un vrai meneur.
    expected_behavior: answer_from_context
    expected_sources:
      - Reddit 1.pdf
    evidence_notes: >
      Reddit 1 mentionne Paolo et Franz, la défense en playoffs, le manque de
      spacing, les absences de Suggs et d'un autre Wagner, ainsi que le besoin
      de shooteurs et d'un meneur.

  - id: Q02
    category: qualitative_simple
    source_type: reddit
    language: fr
    question: D'après la discussion Reddit, qu'est-ce qui a changé dans l'impact de Julius Randle en playoffs ?
    reference_answer: >
      Les commentaires expliquent que Randle paraît beaucoup plus efficace que
      ne le suggérait son ancienne réputation en playoffs. Ils citent son jeu
      physique en attaque, ses meilleures lectures face aux prises à deux, son
      engagement défensif et une forte progression à trois points, avec une
      mention d'un tir à 45 % de loin.
    expected_behavior: answer_from_context
    expected_sources:
      - Reddit 1.pdf
    evidence_notes: >
      Reddit 1 décrit Randle comme une révélation, insiste sur son impact
      physique en attaque et en défense, et mentionne que son tir à 45 % à trois
      points apporte un gros bonus.

  - id: Q03
    category: qualitative_comparison
    source_type: reddit
    language: fr
    question: Quelles équipes sont régulièrement décrites comme impressionnantes en playoffs, et pourquoi ?
    reference_answer: >
      Le fil mentionne notamment le Magic, les Pacers, les Timberwolves et les
      Pistons. Orlando est valorisé pour le duo Paolo-Franz qui a gêné Boston
      malgré des limites offensives. Indiana est cité pour une attaque capable de
      poser problème à n'importe qui et pour une domination plus nette que
      l'année précédente. Minnesota est loué pour son plafond élevé, son équilibre
      attaque/défense, la progression d'Anthony Edwards et une attaque plus
      collective. Detroit est apprécié pour le niveau et le leadership de Cade
      Cunningham, même si l'équipe semble encore avoir besoin d'un créateur ou
      d'un shooteur supplémentaire.
    expected_behavior: synthesize_multiple_contexts
    expected_sources:
      - Reddit 1.pdf
    evidence_notes: >
      Reddit 1 contient des commentaires qui nomment Indiana, Minnesota, Detroit
      et Orlando, avec des explications courtes sur leur potentiel en playoffs.

  - id: Q04
    category: qualitative_complex
    source_type: reddit
    language: fr
    question: Pourquoi certains fans estiment-ils qu'une finale Thunder-Pacers ne devrait pas être considérée comme ennuyeuse ?
    reference_answer: >
      La discussion soutient que cette affiche réunirait de très bonnes équipes
      de basket et que le cadrage négatif vient surtout des médias NBA et des
      habitudes du public occasionnel. Les fans se concentreraient souvent sur
      les highlights, les superstars, les gros marchés et les noms familiers
      plutôt que sur la qualité collective. Un commentaire rappelle que le
      Thunder est statistiquement excellent et que les Pacers enchaînent deux
      finales de conférence, mais que la parité et les petits marchés rendent
      l'intérêt plus difficile à construire pour les spectateurs occasionnels.
    expected_behavior: synthesize_multiple_contexts
    expected_sources:
      - Reddit 2.pdf
    evidence_notes: >
      Reddit 2 présente le problème comme un biais marketing, une obsession des
      grands marchés et des superstars, et une difficulté du public occasionnel à
      reconnaître la qualité d'Oklahoma City et d'Indiana.

  - id: Q05
    category: qualitative_noisy
    source_type: reddit
    language: fr
    question: Franchement, une finale Pacers-Thunder serait vraiment ennuyeuse ou les fans dramatisent ?
    reference_answer: >
      Le fil suggère qu'une telle finale ne serait pas forcément ennuyeuse.
      Plusieurs commentaires s'attendent à une bonne série Pacers-Thunder,
      potentiellement toxique en ligne, et imaginent même des matchs serrés avec
      Shai Gilgeous-Alexander et Tyrese Haliburton au premier plan. La négativité
      semble relever davantage du discours des fans et de la perception
      médiatique que d'une preuve que le basket proposé serait mauvais.
    expected_behavior: answer_from_noisy_question
    expected_sources:
      - Reddit 2.pdf
    evidence_notes: >
      La formulation est volontairement familière/bruitée. La source évoque une
      série Pacers-Thunder potentiellement très bonne mais toxique en ligne, et
      critique le récit d'une affiche ennuyeuse.

  - id: Q06
    category: historical_analysis
    source_type: reddit
    language: fr
    question: Quel est l'argument principal pour présenter Reggie Miller comme une première option historiquement efficace en playoffs ?
    reference_answer: >
      L'argument principal est que Reggie Miller arrive en tête d'une comparaison
      des premières options offensives en efficacité au scoring en playoffs,
      ajustée au contexte de son époque. Le post affirme que son écart
      d'efficacité avec des joueurs comme Stephen Curry est important, et que
      même en se limitant à son prime de 1991 à 2002, il marque environ 24 points
      par match sur plus de 100 matchs de playoffs avec un relative true shooting
      de 115. La discussion nuance aussi ce point en rappelant que son volume de
      tirs est inférieur à celui de nombreux autres grands scoreurs.
    expected_behavior: answer_from_context
    expected_sources:
      - Reddit 3.pdf
    evidence_notes: >
      Reddit 3 contient l'affirmation sur l'efficacité de Reggie Miller, la
      précision sur ses années de prime et le débat efficacité versus volume.

  - id: Q07
    category: historical_qa
    source_type: reddit
    language: fr
    question: Quelle équipe NBA n'a pas eu l'avantage du terrain avant les Finales, puis l'a eu en Finales ?
    reference_answer: >
      La réponse attendue d'après le fil est qu'il n'existe probablement pas de
      telle équipe dans la NBA moderne. Un commentaire indique que six équipes
      classées plus bas qu'une quatrième place ont atteint les Finales, mais
      qu'aucune n'y avait l'avantage du terrain. Le Heat 2023 est mentionné comme
      quasi-exemple, mais Denver avait l'avantage du terrain dans ces Finales,
      donc Miami ne répond pas à la question.
    expected_behavior: answer_from_context
    expected_sources:
      - Reddit 4.pdf
    evidence_notes: >
      Reddit 4 pose directement la question de l'avantage du terrain et contient
      des commentaires qui écartent Miami 2023 parce que Denver avait l'avantage
      du terrain en Finales.

  - id: Q08
    category: quantitative_excel
    source_type: excel
    language: fr
    question: Parmi les joueurs avec au moins 300 tentatives à trois points, qui a le meilleur pourcentage à trois points dans les données Excel ?
    reference_answer: >
      Zach LaVine possède le meilleur pourcentage à trois points parmi les
      joueurs avec au moins 300 tentatives dans la table Excel : 44,6 % sur 533
      tentatives avec Sacramento. Les autres shooteurs à gros volume visibles en
      haut du classement incluent Taurean Prince à 43,9 %, Harrison Barnes et
      Keon Ellis à 43,3 %, puis Kevin Durant à 43,0 %.
    expected_behavior: compute_from_structured_data
    expected_sources:
      - "regular NBA.xlsx (Feuille: Données NBA)"
    evidence_notes: >
      La table Excel directe confirme ce classement. L'index RAG actuel stocke
      cette table comme du texte, donc ce cas devrait être plus difficile avant
      l'ajout de l'outil SQL.

  - id: Q09
    category: quantitative_excel
    source_type: excel
    language: fr
    question: Quel joueur a le plus grand total de rebonds dans la table Excel des joueurs ?
    reference_answer: >
      Ivica Zubac possède le plus grand total de rebonds dans la table Excel des
      joueurs, avec 1008 rebonds pour les Los Angeles Clippers. Les joueurs
      suivants dans ce classement incluent Domantas Sabonis avec 973 rebonds,
      Karl-Anthony Towns avec 922 et Nikola Jokic avec 889.
    expected_behavior: compute_from_structured_data
    expected_sources:
      - "regular NBA.xlsx (Feuille: Données NBA)"
    evidence_notes: >
      Les colonnes de rebonds sont définies dans la feuille dictionnaire, et la
      table des joueurs contient la ligne d'Ivica Zubac avec 1008 REB.

  - id: Q10
    category: quantitative_limit
    source_type: excel
    language: fr
    question: Quel joueur a le meilleur pourcentage à trois points sur les cinq derniers matchs ?
    reference_answer: >
      Les sources actuellement indexées ne fournissent pas de lignes match par
      match ni de découpage sur les cinq derniers matchs. Le prototype ne doit
      donc pas inventer une réponse exacte sur cette période. Le classeur Excel
      contient des agrégats de saison comme GP, 3PA et 3P%, qui permettent de
      répondre à des questions au niveau saison, mais pas d'établir de façon
      fiable un classement sur les cinq derniers matchs. Ce cas devrait
      s'améliorer seulement après l'ajout d'une base structurée avec des
      statistiques par match.
    expected_behavior: refuse_or_qualify_missing_data
    expected_sources:
      - "regular NBA.xlsx (Feuille: Données NBA)"
      - "regular NBA.xlsx (Feuille: Dictionnaire des données)"
    evidence_notes: >
      C'est un cas limite volontaire pour la phase 1. Il reprend l'exemple de
      question de l'énoncé et doit justifier l'enrichissement SQL/base de données
      de la phase 2.
